[tools]
python = "3.13"
uv     = "latest"
node   = "24"
hk     = "latest"
pkl    = "latest"
ruff   = "latest"

[settings]
experimental = true

[env]
UV_PREVIEW = "1"

# ── toolchains ──────────────────────────────────────────────────────────────

[tasks.install]
description = "Install both toolchains"
depends     = ["py:install", "ts:install"]

[tasks."py:install"]
description = "Sync the uv environment"
run         = "uv sync"

[tasks."ts:install"]
description = "Install node dependencies"
run         = "npm ci"

# ── questions ───────────────────────────────────────────────────────────────

[tasks.sync]
description = "Regenerate a question's generated files. Default: every question."
usage       = """
arg "[name]" default="all" help="Question directory under questions/, or 'all'"
"""
run = """
set -e
if [ "$usage_name" = all ]; then
  set -- questions/*/
else
  set -- "questions/$usage_name/"
  [ -d "$1" ] || { echo "no such question: $usage_name (have: $(ls questions | tr '\\n' ' '))" >&2; exit 1; }
fi
for q; do
  echo "── $(basename "$q")"
  # common/data.py prints the dataset to stdout; the JSON beside it is what both languages read
  [ -f "$q/common/data.py" ] && uv run python "$q/common/data.py" > "$q/common/data.json"
  true
done
uv run python -m tools.packet
"""

# ── checks ──────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run all tests, both languages"
depends     = ["py:test", "ts:test"]

[tasks."py:test"]
description = "Run python tests — the library, the tooling, and every question's grading suite"
depends     = ["sync"]
run         = "uv run pytest"

[tasks."ts:test"]
description = "Run typescript tests — the library and every question's port"
depends     = ["sync"]
run         = "node --test questions/*/ts/*.test.ts"

[tasks.typecheck]
description = "Typecheck both languages"
depends     = ["py:typecheck", "ts:typecheck"]

[tasks."py:typecheck"]
description = "Run pyright"
run         = "uv run pyright"

[tasks."ts:typecheck"]
description = "Run tsc"
run         = "npx tsc --noEmit"

[tasks.lint]
description = "Run linters"
run         = "hk check"

[tasks.fix]
description = "Auto-fix lint issues"
run         = "hk fix"

# ── coderpad ────────────────────────────────────────────────────────────────

[tasks."coderpad:sync"]
description = "Build the CoderPad project for every question and language (--push syncs them, needs ~/.config/coderpad/cookie)"
usage       = '''
flag "--push" help="Also sync the questions to your CoderPad question bank"
flag "--recreate" help="Replace the questions — the only way to change their project files, and it changes their ids"
'''
run = 'uv run python -m tools.coderpad ${usage_push:+--push} ${usage_recreate:+--recreate}'

[tasks."coderpad:test"]
description = "Check every CoderPad project compiles and runs the way its pad does — offline"
run         = "uv run python -m tools.coderpad_check"
