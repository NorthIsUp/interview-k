[tools]
python = "3.13"
uv     = "latest"
node   = "24"
hk     = "latest"
pkl    = "latest"
ruff   = "latest"

[settings]
experimental = true

[env]
UV_PREVIEW = "1"

# ── python (py/) ────────────────────────────────────────────────────────────

[tasks."py:sync"]
description = "Sync uv environment"
dir         = "py"
run         = "uv sync"

[tasks."py:test"]
description = "Run python tests"
dir         = "py"
run         = "uv run pytest"

[tasks."py:typecheck"]
description = "Run pyright"
dir         = "py"
run         = "uv run pyright"

[tasks."py:build"]
description = "Build wheel + sdist"
dir         = "py"
run         = "uv build"

[tasks."py:fixture"]
description = "Regenerate the parity fixture the TS port is tested against"
dir         = "py"
run         = "uv run python -m tools.ts_fixture"

# ── typescript (ts/) ────────────────────────────────────────────────────────

[tasks."ts:sync"]
description = "Install node dependencies"
dir         = "ts"
run         = "npm ci"

[tasks."ts:test"]
description = "Run typescript tests"
dir         = "ts"
run         = "node --test test/*.test.ts"

[tasks."ts:typecheck"]
description = "Run tsc"
dir         = "ts"
run         = "npx tsc --noEmit"

# ── both ────────────────────────────────────────────────────────────────────

[tasks.sync]
description = "Sync both toolchains"
depends     = ["py:sync", "ts:sync"]

[tasks.test]
description = "Run all tests"
depends     = ["py:test", "ts:test"]

[tasks.typecheck]
description = "Typecheck both languages"
depends     = ["py:typecheck", "ts:typecheck"]

[tasks.lint]
description = "Run linters"
run         = "hk check"

[tasks.fix]
description = "Auto-fix lint issues"
run         = "hk fix"

[tasks.version]
description = "Print current version"
dir         = "py"
run         = "uv version --short"

[tasks.bump-patch]
description = "Bump patch version"
dir         = "py"
run         = "uv version --bump patch"

[tasks.bump-minor]
description = "Bump minor version"
dir         = "py"
run         = "uv version --bump minor"

[tasks.bump-major]
description = "Bump major version"
dir         = "py"
run         = "uv version --bump major"

[tasks."coderpad:sync"]
description = "Build the CoderPad project for both languages (--push syncs them, needs ~/.config/coderpad/cookie)"
dir         = "py"
usage       = '''
flag "--push" help="Also sync both questions to your CoderPad question bank"
flag "--recreate" help="Replace the questions — the only way to change their project files, and it changes their ids"
'''
run         = 'uv run python tools/coderpad.py ${usage_push:+--push} ${usage_recreate:+--recreate}'

[tasks."coderpad:test"]
description = "Check both CoderPad projects compile and run the way their pads do — offline"
dir         = "py"
run         = "uv run python -m tools.coderpad_check"
