[project]
name            = "interview-k"
version         = "0.1.0"
description     = "k-means live-coding interview: problem packet, rubric, and a stdlib ASCII scatter helper"
readme          = "README.md"
requires-python = ">=3.13"
license         = { text = "MIT" }
authors         = [{ name = "Adam Hitchcock", email = "adam@northisup.com" }]
dependencies    = []

[dependency-groups]
dev = [
    "numpy>=2",        # only for the ndarray-compat self-test; the library needs none
    "pydantic>=2",     # a question's stub may use it; see questions/*/py/requirements.txt
    "pytest>=9",
    "pyright>=1.1",
]

[tool.ruff]
line-length    = 140
preview        = true
target-version = "py313"
extend-exclude = ["**/examples/**"]

lint.extend-select = [
    "A",     # shadowing
    "ANN",   # annotations
    "ASYNC", # async rules
    "B",     # bugbear common python bugs
    "BLE",   # blind except
    "COM",   # comma rules
    "E",     # errors
    "F",     # pyflakes
    "FA",    # future annotations
    "FURB",  # refurb rules
    "I",     # imports + isort
    "ISC",   # implicit string concatenation
    "N",     # pep8-naming
    "PLR",   # refactor rules
    "RUF",   # ruff rules
    "TC",    # type checking
    "UP",    # upgrades
    "YTT",   # modern syntax
]
lint.ignore = [
    "builtin-argument-shadowing",
    "stdlib-module-shadowing",
    "missing-trailing-comma",  # conflicts with ruff format
    "single-line-implicit-string-concatenation",  # conflicts with ruff format
]
lint.extend-safe-fixes = [
    "FA",
    "future-required-type-annotation",
    "TC",
    "UP",
]
lint.flake8-type-checking.runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
lint.future-annotations = true

[tool.ruff.lint.per-file-ignores]
"questions/*/py/main.py" = ["ANN", "ARG", "TC", "unnecessary-placeholder"]   # the candidate's stub: unfinished is the point
"**/*_test.py" = ["ANN", "TC", "magic-value-comparison"]
"**/test_*.py" = ["ANN", "magic-value-comparison"]   # each question grades itself in its own directory
"scripts/**" = ["debugger", "missing-type-function-argument", "missing-return-type-undocumented-public-function", "shebang-not-executable", "shebang-missing-executable-file"]

[tool.pyproject-fmt]
column_width      = 1
indent            = 4
keep_full_version = false

[tool.pytest.ini_options]
addopts        = ["-vv", "-ra", "--import-mode=importlib"]
pythonpath     = ["."]   # questions are packages: `from questions.kmeans.py.main import kmeans`
filterwarnings = [
    "error::pytest.PytestUnknownMarkWarning",
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
]
log_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_level  = "DEBUG"
testpaths  = ["tools", "questions"]   # each suite sits beside what it tests

[tool.pyright]
venv          = ".venv"
venvPath      = "."
exclude       = ["**/__pycache__", "**/.venv", "build"]   # build/ holds the generated CoderPad bundle
pythonVersion = "3.13"

reportConstantRedefinition         = "error"
reportDeprecated                   = "warning"
reportDuplicateImport              = "error"
reportImportCycles                 = "warning"
reportIncompatibleMethodOverride   = "error"
reportInconsistentConstructor      = "warning"
reportInvalidTypeVarUse            = "error"
reportMatchNotExhaustive           = "warning"
reportMissingImports               = "error"
reportMissingModuleSource          = "error"
reportMissingTypeStubs             = false
reportPrivateImportUsage           = "error"
reportSelfClsParameterName         = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUntypedBaseClass             = "error"
reportUntypedClassDecorator        = "error"
reportUntypedFunctionDecorator     = "warning"
reportUnusedImport                 = "error"
strictDictionaryInference          = true
strictListInference                = true
strictSetInference                 = true
typeCheckingMode                   = "strict"
