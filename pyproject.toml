[project]
name            = "interview-k"
version         = "0.1.0"
description     = "k-means live-coding interview: problem packet, rubric, and a stdlib ASCII scatter helper"
readme          = "README.md"
requires-python = ">=3.13"
license         = { text = "MIT" }
authors         = [{ name = "Adam Hitchcock", email = "adam@northisup.com" }]
dependencies    = []

[project.scripts]
interview-k = "interview_k.show:_demo"

[build-system]
requires      = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2",        # only for the ndarray-compat self-test; the library needs none
    "pytest>=9",
    "pyright>=1.1",
]

[tool.ruff]
line-length    = 140
preview        = true
target-version = "py313"
extend-exclude = ["**/examples/**"]

lint.extend-select = [
    "A",     # shadowing
    "ANN",   # annotations
    "ASYNC", # async rules
    "B",     # bugbear common python bugs
    "BLE",   # blind except
    "COM",   # comma rules
    "E",     # errors
    "F",     # pyflakes
    "FA",    # future annotations
    "FURB",  # refurb rules
    "I",     # imports + isort
    "ISC",   # implicit string concatenation
    "N",     # pep8-naming
    "PLR",   # refactor rules
    "RUF",   # ruff rules
    "TC",    # type checking
    "UP",    # upgrades
    "YTT",   # modern syntax
]
lint.ignore = [
    "builtin-argument-shadowing",
    "stdlib-module-shadowing",
    "missing-trailing-comma",  # conflicts with ruff format
    "single-line-implicit-string-concatenation",  # conflicts with ruff format
]
lint.extend-safe-fixes = [
    "FA",
    "future-required-type-annotation",
    "TC",
    "UP",
]
lint.flake8-type-checking.runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
lint.future-annotations = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "magic-value-comparison"]
"scripts/**" = ["debugger", "missing-type-function-argument", "missing-return-type-undocumented-public-function", "shebang-not-executable", "shebang-missing-executable-file"]

[tool.pyproject-fmt]
column_width      = 1
indent            = 4
keep_full_version = false

[tool.pytest.ini_options]
addopts        = ["-vv", "-ra"]
pythonpath     = ["."]   # so tests can `from main import kmeans`
asyncio_mode   = "auto"
filterwarnings = [
    "error::pytest.PytestUnknownMarkWarning",
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
]
log_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_level  = "DEBUG"
testpaths  = ["tests"]

[tool.pyright]
venv          = ".venv"
venvPath      = "."
exclude       = ["**/__pycache__", "**/.venv"]
pythonVersion = "3.13"

reportConstantRedefinition         = "error"
reportDeprecated                   = "warning"
reportDuplicateImport              = "error"
reportImportCycles                 = "warning"
reportIncompatibleMethodOverride   = "error"
reportInconsistentConstructor      = "warning"
reportInvalidTypeVarUse            = "error"
reportMatchNotExhaustive           = "warning"
reportMissingImports               = "error"
reportMissingModuleSource          = "error"
reportMissingTypeStubs             = false
reportPrivateImportUsage           = "error"
reportSelfClsParameterName         = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUntypedBaseClass             = "error"
reportUntypedClassDecorator        = "error"
reportUntypedFunctionDecorator     = "warning"
reportUnusedImport                 = "error"
strictDictionaryInference          = true
strictListInference                = true
strictSetInference                 = true
typeCheckingMode                   = "strict"
