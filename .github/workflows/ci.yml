name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: mise run sync
      - run: uv run pytest

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

      # data.json is generated but committed, so regenerating it must be a no-op. A diff means
      # someone hand-edited it, or common/data.py drifted.
      - run: git diff --exit-code

      # A pad compiles TypeScript as CommonJS under ts-node, which the checks above never
      # exercise — every pad bug so far was invisible until this ran. Needs node_modules for
      # tsc, so it goes after `npm ci`.
      - run: uv run python -m tools.coderpad_check
