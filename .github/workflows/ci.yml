name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - run: uv sync --all-extras --dev
        working-directory: py
      - run: uv run ruff check .
        working-directory: py
      - run: uv run ruff format --check .
        working-directory: py
      - run: uv run pyright
        working-directory: py
      - run: uv run pytest
        working-directory: py

      - run: npm ci
        working-directory: ts
      - run: npx tsc --noEmit
        working-directory: ts
      - run: node --test test/*.test.ts
        working-directory: ts

      # The TS datasets are only a port while they still match Python's, so regenerate
      # the fixture from Python and fail if it moved.
      - run: uv run python tools/ts_fixture.py
        working-directory: py
      - run: git diff --exit-code ts/test/parity.json

  release:
    # Single-pipeline release: GitHub Actions can't trigger workflows from
    # tags pushed by GITHUB_TOKEN, so tag + release + publish all happen
    # in this one job after tests pass on main.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push tag, create release
      id-token: write   # PyPI trusted publishing (OIDC)
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Detect version bump
        id: version
        working-directory: py
        run: |
          set -euo pipefail
          new=$(uv version --short)
          # previous version from the parent commit's pyproject.toml
          if old=$(git show HEAD~1:py/pyproject.toml 2>/dev/null | uv run --no-project python -c '
          import sys, tomllib
          print(tomllib.loads(sys.stdin.read())["project"]["version"])
          '); then :; else old=""; fi
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ "$old" != "$new" ] && [ -n "$new" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "tag=v$new" >> "$GITHUB_OUTPUT"
            echo "Version bumped: $old -> $new"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "No version change ($old == $new)"
          fi

      - name: Tag release
        if: steps.version.outputs.bumped == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Build
        if: steps.version.outputs.bumped == 'true'
        working-directory: py
        run: uv build

      - name: Publish to PyPI
        if: steps.version.outputs.bumped == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: py/dist

      - name: Create GitHub Release
        if: steps.version.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            py/dist/*
